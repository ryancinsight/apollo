[package]
name = "apollo-validation"
version = "0.3.0"
rust-version.workspace = true
edition = "2021"
license = "MIT"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
repository.workspace = true
description = "Validation and benchmark surface for Apollo FFT"

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = [
    "apollo-fft/parallel",
    "apollo-nufft/parallel",
    "apollo-dctdst/parallel",
    "apollo-ntt/parallel",
    "apollo-frft/parallel",
    "apollo-sdft/parallel",
    "apollo-wavelet/parallel",
    "apollo-fwht/parallel",
    "apollo-qft/parallel",
    "apollo-gft/parallel",
    "apollo-hilbert/parallel",
    "apollo-mellin/parallel",
    "apollo-radon/parallel",
    "apollo-sft/parallel",
    "apollo-sht/parallel",
    "apollo-stft/parallel",
]
mnemosyne-memory = [
    "apollo-fft/mnemosyne-memory",
    "apollo-nufft/mnemosyne-memory",
    "apollo-dctdst/mnemosyne-memory",
    "apollo-ntt/mnemosyne-memory",
    "apollo-frft/mnemosyne-memory",
    "apollo-sdft/mnemosyne-memory",
    "apollo-wavelet/mnemosyne-memory",
    "apollo-fwht/mnemosyne-memory",
    "apollo-qft/mnemosyne-memory",
    "apollo-gft/mnemosyne-memory",
    "apollo-hilbert/mnemosyne-memory",
    "apollo-mellin/mnemosyne-memory",
    "apollo-radon/mnemosyne-memory",
    "apollo-sft/mnemosyne-memory",
    "apollo-sht/mnemosyne-memory",
    "apollo-stft/mnemosyne-memory",
]

[dependencies]
apollo-fft = { version = "0.25.0", path = "../apollo-fft", features = ["wgpu"] }
apollo-nufft = { version = "0.7.0", path = "../apollo-nufft", features = ["wgpu"] }
apollo-dctdst = { version = "0.10.0", path = "../apollo-dctdst" }
apollo-dht = { version = "0.10.0", path = "../apollo-dht" }
apollo-ntt = { version = "0.9.0", path = "../apollo-ntt" }
apollo-czt = { version = "0.10.0", path = "../apollo-czt" }
apollo-frft = { version = "0.9.0", path = "../apollo-frft" }
apollo-sdft = { version = "0.8.0", path = "../apollo-sdft" }
apollo-wavelet = { version = "0.10.0", path = "../apollo-wavelet" }
apollo-fwht = { version = "0.9.0", path = "../apollo-fwht" }
apollo-qft = { version = "0.9.0", path = "../apollo-qft" }
apollo-gft = { version = "0.10.0", path = "../apollo-gft" }
apollo-hilbert = { version = "0.12.0", path = "../apollo-hilbert" }
apollo-mellin = { version = "0.11.0", path = "../apollo-mellin" }
apollo-radon = { version = "0.10.0", path = "../apollo-radon" }
apollo-sft = { version = "0.9.0", path = "../apollo-sft" }
apollo-sht = { version = "0.7.0", path = "../apollo-sht" }
apollo-stft = { version = "0.9.0", path = "../apollo-stft" }
serde = { workspace = true }
serde_json.workspace = true
melinoe = { workspace = true }
moirai = { workspace = true }
leto = { workspace = true }
eunomia = { workspace = true, features = ["serde"] }
hephaestus-core = { workspace = true }
hephaestus-wgpu = { workspace = true }

[dev-dependencies]
mnemosyne = { workspace = true }

[lints]
workspace = true
