[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "apollo-fft"
dynamic = ["version"]
description = "Python bindings for Apollo FFT"
authors = [
    {name = "Ryan Clanton PhD", email = "ryanclanton@outlook.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20,<3.0",
]
keywords = ["fft", "nufft", "fourier", "scientific-computing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://ryancinsight.github.io/apollo/"
Issues = "https://github.com/ryancinsight/apollo/issues"
Repository = "https://github.com/ryancinsight/apollo"

[tool.maturin]
python-source = "python"
module-name = "pyapollofft._pyapollofft"

