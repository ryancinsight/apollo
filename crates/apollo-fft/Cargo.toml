[package]
name = "apollo-fft"
version = "0.30.0"
rust-version.workspace = true
edition = "2021"
license = "MIT"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
repository.workspace = true
description = "Reusable FFT planning, execution, and cache abstractions for Apollo"

[dependencies]
hephaestus-wgpu = { workspace = true, optional = true }
hephaestus-core = { workspace = true, optional = true }
hephaestus-cuda = { workspace = true, optional = true }
apollo-fft-macros = { version = "0.3.1", path = "../apollo-fft-macros" }
apollo-leto-interop = { version = "0.20.1", path = "../apollo-leto-interop" }
hermes-simd = { workspace = true }
leto = { workspace = true }
leto-ops = { workspace = true }
eunomia = { workspace = true }
once_cell.workspace = true
parking_lot.workspace = true
moirai = { workspace = true }
mnemosyne = { workspace = true }
rustc-hash = "2.0"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
apollo-bench = { path = "../apollo-bench" }
proptest.workspace = true
rustfft.workspace = true
# RustFFT scratch uses Complex<T>; zero validity is supplied by num-complex.
num-complex = { version = "0.4.6", features = ["bytemuck"] }
themis = { workspace = true }
phastft.workspace = true
realfft.workspace = true
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[[bench]]
name = "rustfft_comparison"
harness = false

[[bench]]
name = "phastft_comparison"
harness = false

[[bench]]
name = "engine_census"
harness = false

[[bench]]
name = "lane_threshold"
harness = false
[features]
wgpu = [
    "dep:hephaestus-wgpu",
    "dep:hephaestus-core",
]
cuda = [
    "dep:hephaestus-cuda",
    "dep:hephaestus-core",
]
default = ["parallel", "mnemosyne-memory"]
parallel = []
mnemosyne-memory = []
kernel-strategy-bench = []
cache-profiling = []

[[bench]]
name = "kernel_strategy"
harness = false

[[bench]]
name = "prime_compose"
harness = false

[[bench]]
name = "half_cyclic_rader"
harness = false

[[bench]]
name = "twiddless_comparison"
harness = false
required-features = ["kernel-strategy-bench"]

[lints]
workspace = true
