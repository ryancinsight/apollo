[package]
name = "apollo-fft"
version = "0.27.0"
rust-version.workspace = true
edition = "2021"
license = "MIT"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
repository.workspace = true
description = "Reusable FFT planning, execution, and cache abstractions for Apollo"

[dependencies]
hephaestus-wgpu = { workspace = true, optional = true }
hephaestus-core = { workspace = true, optional = true }
hephaestus-cuda = { workspace = true, optional = true }
bytemuck = { workspace = true }
apollo-fft-macros = { version = "0.2.0", path = "../apollo-fft-macros" }
apollo-leto-interop = { version = "0.18.0", path = "../apollo-leto-interop" }
half = { workspace = true }
hermes-simd = { workspace = true }
leto = { workspace = true }
leto-ops = { workspace = true }
eunomia = { workspace = true }
once_cell.workspace = true
parking_lot.workspace = true
rand = { workspace = true }
moirai = { workspace = true }
mnemosyne = { workspace = true }
rustc-hash = "2.0"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
apollo-bench = { path = "../apollo-bench" }
proptest.workspace = true
rustfft.workspace = true
phastft.workspace = true
realfft.workspace = true

[[bench]]
name = "rustfft_comparison"
harness = false

[[bench]]
name = "phastft_comparison"
harness = false

[[bench]]
name = "engine_census"
harness = false
[features]
wgpu = [
    "dep:hephaestus-wgpu",
    "dep:hephaestus-core",
]
cuda = [
    "dep:hephaestus-cuda",
    "dep:hephaestus-core",
]
default = ["parallel", "mnemosyne-memory"]
parallel = []
mnemosyne-memory = []
kernel-strategy-bench = []
cache-profiling = []

[[bench]]
name = "kernel_strategy"
harness = false

[[bench]]
name = "prime_compose"
harness = false

[[bench]]
name = "half_cyclic_rader"
harness = false

[lints]
workspace = true
