[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
# A rerun hides a flake instead of root-causing it, and a test that only
# passes sometimes is a defect in the system under test or in the test's own
# synchronisation. Explicit here rather than relying on the default so a
# future profile cannot inherit a retry by accident.
retries = 0

# CI runs to completion so one run reports every failure. Fail-fast costs a
# whole extra round trip per additional failure, which is the opposite of a
# minimal CI budget when several tests break together.
[profile.ci]
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 0
fail-fast = false
status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

[test-groups]
gpu-device = { max-threads = 1 }
# The pinned probes bind threads to named processors and, in the schedule
# instruments, apply a process-wide affinity mask. Run concurrently they
# measure each other: two regimes pinned to overlapping core sets contend for
# the same silicon, which moved one 64-cubed reading 8.4% between runs while
# its own confidence interval spanned 2.6%. The host CPU is the shared device
# here exactly as the GPU is above.
pinned-probe = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/infrastructure::transport::gpu/)'
test-group = "gpu-device"

[[profile.default.overrides]]
filter = 'test(/infrastructure::transport::cuda/)'
test-group = "gpu-device"

[[profile.default.overrides]]
filter = 'test(/gpu_fft/)'
test-group = "gpu-device"

[[profile.default.overrides]]
filter = 'test(/pinned_probe/)'
test-group = "pinned-probe"
