[workspace]
members = [
    "crates/apollo-czt",
    "crates/apollo-dctdst",
    "crates/apollo-dht",
    "crates/apollo-fft",
    "crates/apollo-fft-macros",
    "crates/apollo-bench",
    "crates/apollo-frft",
    "crates/apollo-fwht",
    "crates/apollo-gft",
    "crates/apollo-hilbert",
    "crates/apollo-leto-interop",
    "crates/apollo-mellin",
    "crates/apollo-ntt",
    "crates/apollo-nufft",
    "crates/apollo-qft",
    "crates/apollo-radon",
    "crates/apollo-sdft",
    "crates/apollo-sft",
    "crates/apollo-sht",
    "crates/apollo-stft",
    "crates/apollo-validation",
    "crates/apollo-wavelet",
    "crates/apollo-python",
    "xtask",
]
resolver = "3"

[profile.release]
# Single codegen unit: allows LLVM to inline num_complex::Complex64::mul and
# all internal helpers into one module, enabling autovectorization of the
# butterfly inner loop with AVX2/FMA across the full optimization scope.
codegen-units = 1
# Thin LTO: cross-crate inlining (e.g. num_complex, Moirai-dispatched closures) without
# the full compilation overhead of fat LTO.
lto = "thin"

[profile.bench-quick]
inherits = "release"
codegen-units = 16
incremental = false
lto = false

[profile.bench]
inherits = "release"
codegen-units = 8
lto = "thin"


[workspace.package]
version = "0.16.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
repository = "https://github.com/ryancinsight/apollo"

[workspace.dependencies]
anyhow = "1.0.103"
bytemuck = { version = "1.25.1", features = ["derive"] }
csv = "1.4.0"
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false, features = ["std"] }
mnemosyne = { package = "mnemosyne-memory", version = "0.7.0", git = "https://github.com/ryancinsight/Mnemosyne.git", features = ["eunomia"] }
melinoe = { version = "0.9.0", git = "https://github.com/ryancinsight/melinoe.git", default-features = false, features = ["alloc"] }
hermes-simd = { version = "0.6.0", git = "https://github.com/ryancinsight/hermes.git" }
half = { version = "2.7.1", features = ["serde", "use-intrinsics"] }
leto = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git" }
leto-ops = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git" }
# Hephaestus is Apollo's shared Atlas accelerator substrate (atlas ADR 0001).
# Transform crates depend on its typed device and kernel contracts directly.
hephaestus-wgpu = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git" }
hephaestus-core = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git" }
hephaestus-cuda = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git" }
proc-macro2 = "1.0.106"
once_cell = "1.21.4"
parking_lot = "0.12.5"
proptest = "1.11.0"
quote = "1.0.46"
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }
rand = "0.10.2"
# Dev-only comparison baseline for `benchmark_results.md`. Its default features
# are SIMD (avx/sse/neon) with no rayon edge, so it does not reintroduce the
# transitive parallelism ADR 0011 removed with Criterion.
rustfft = "6.4.1"
# moirai: data-parallel runtime replacing direct scheduler usage.
moirai = { package = "moirai-runtime", version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git", features = ["melinoe"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.118", features = ["full"] }
thiserror = "2.0.18"
# Hephaestus 0.15 owns Apollo's WGPU 30 device contract.

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed is a
# hard error. Counts are `cargo clippy --workspace --all-targets --all-features`
# hits (the gate's own invocation) at the time the floor was established,
# deduplicated per source site, as total (production), where production excludes
# `#[cfg(test)]` modules and test, bench and example targets. Burn a class down
# to zero, then delete its line -- the floor tightens, never loosens.

cast_precision_loss = "allow"                   # 1096 (801 prod)
doc_markdown = "allow"                          # 547 (502 prod)
unreadable_literal = "allow"                    # 433 (422 prod)
missing_errors_doc = "allow"                    # 395 (395 prod)
cast_possible_truncation = "allow"              # 390 (347 prod)
excessive_precision = "allow"                   # 350 (350 prod)
cast_lossless = "allow"                         # 321 (306 prod)
missing_panics_doc = "allow"                    # 168 (168 prod)
similar_names = "allow"                         # 154 (153 prod)
semicolon_if_nothing_returned = "allow"         # 118 (118 prod)
cast_possible_wrap = "allow"                    # 90 (78 prod)
needless_range_loop = "allow"                   # 71 (69 prod)
items_after_statements = "allow"                # 61 (61 prod)
needless_pass_by_value = "allow"                # 57 (57 prod)
elidable_lifetime_names = "allow"               # 45 (45 prod)
too_many_lines = "allow"                        # 43 (39 prod)
uninlined_format_args = "allow"                 # 33 (30 prod)
cast_sign_loss = "allow"                        # 30 (28 prod)
manual_is_multiple_of = "allow"                 # 30 (29 prod)
default_trait_access = "allow"                  # 21 (21 prod)
too_many_arguments = "allow"                    # 20 (20 prod)
type_complexity = "allow"                       # 17 (17 prod)
redundant_closure_for_method_calls = "allow"    # 14 (1 prod)
cast_ptr_alignment = "allow"                    # 14 (14 prod)
explicit_iter_loop = "allow"                    # 12 (8 prod)
approx_constant = "allow"                       # 12 (12 prod)
single_match_else = "allow"                     # 12 (12 prod)
match_same_arms = "allow"                       # 10 (10 prod)
missing_const_for_thread_local = "allow"        # 10 (10 prod)
float_cmp = "allow"                             # 9 (7 prod)
many_single_char_names = "allow"                # 9 (9 prod)
manual_div_ceil = "allow"                       # 8 (6 prod)
same_item_push = "allow"                        # 8 (8 prod)
must_use_candidate = "allow"                    # 8 (8 prod)
needless_for_each = "allow"                     # 7 (7 prod)
trivially_copy_pass_by_ref = "allow"            # 7 (7 prod)
missing_fields_in_debug = "allow"               # 5 (5 prod)
struct_excessive_bools = "allow"                # 5 (5 prod)
unused_self = "allow"                           # 4 (4 prod)
uninit_vec = "allow"                            # 1 (1 prod)

# --- Restriction floor ---
# `unwrap_used` is denied outright: no workspace-wide allow. Pre-existing sites
# are pinned per file by `#![expect(..., reason = "ratchet APOLLO-UNWRAP-1")]`
# (`#![cfg_attr(test, expect(...))]` where a `src/` file's unwraps are all
# inside `#[cfg(test)]`), which self-expires the moment a file's last unwrap goes.
unwrap_used = "deny"
