[workspace]
members = [
    "crates/apollo-czt",
    "crates/apollo-dctdst",
    "crates/apollo-dht",
    "crates/apollo-fft",
    "crates/apollo-fft-macros",
    "crates/apollo-bench",
    "crates/apollo-frft",
    "crates/apollo-fwht",
    "crates/apollo-gft",
    "crates/apollo-hilbert",
    "crates/apollo-leto-interop",
    "crates/apollo-mellin",
    "crates/apollo-ntt",
    "crates/apollo-nufft",
    "crates/apollo-qft",
    "crates/apollo-radon",
    "crates/apollo-sdft",
    "crates/apollo-sft",
    "crates/apollo-sht",
    "crates/apollo-stft",
    "crates/apollo-validation",
    "crates/apollo-wavelet",
    "crates/apollo-python",
    "xtask",
]
resolver = "3"

[profile.release]
# Single codegen unit: allows LLVM to inline num_complex::Complex64::mul and
# all internal helpers into one module, enabling autovectorization of the
# butterfly inner loop with AVX2/FMA across the full optimization scope.
codegen-units = 1
# Thin LTO: cross-crate inlining (e.g. num_complex, Moirai-dispatched closures) without
# the full compilation overhead of fat LTO.
lto = "thin"

[profile.bench-quick]
inherits = "release"
codegen-units = 16
incremental = false
lto = false

[profile.bench]
# Performance measurements use the exact release optimization contract.
# `bench-quick` remains the explicit fast-compilation profile for smoke runs.
inherits = "release"


[workspace.package]
version = "0.16.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
repository = "https://github.com/ryancinsight/apollo"

[workspace.dependencies]
anyhow = "1.0.103"
csv = "1.4.0"
# Temporary co-evolution pin for Eunomia PR #87; remove `rev` after the
# provider derive delivery merges to main and regenerate Cargo.lock.
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", rev = "fdbf12275d35aa1545060a4277644c497ddcda37", default-features = false, features = ["std"] }
# Temporary co-evolution pin for Mnemosyne PR #128; remove `rev` after the
# pooled-scratch release surface merges to main and regenerate Cargo.lock.
mnemosyne = { package = "mnemosyne-memory", version = "0.7.0", git = "https://github.com/ryancinsight/Mnemosyne.git", rev = "48b6888410cdeef79acfb733ea00328c5e572f96", features = ["eunomia"] }
melinoe = { version = "0.9.0", git = "https://github.com/ryancinsight/melinoe.git", default-features = false, features = ["alloc"] }
# Temporary co-evolution pin for Hermes PR #155; remove `rev` after its
# provider source-identity correction merges to main and regenerate Cargo.lock.
hermes-simd = { version = "0.7.0", git = "https://github.com/ryancinsight/hermes.git", rev = "5a399ee" }
# Temporary co-evolution pin for Leto PR #164; remove `rev` after its
# provider source-identity correction merges to main and regenerate Cargo.lock.
leto = { version = "0.43.0", git = "https://github.com/ryancinsight/leto.git", rev = "1caa846" }
leto-ops = { version = "0.43.0", git = "https://github.com/ryancinsight/leto.git", rev = "1caa846" }
# Hephaestus PR #270 carries the merged-Leto source edge and the Eunomia
# provider identity required by this co-evolution increment. Remove `rev`
# after that PR merges and regenerate Cargo.lock.
hephaestus-wgpu = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", rev = "7ca992d" }
hephaestus-core = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", rev = "7ca992d" }
hephaestus-cuda = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", rev = "7ca992d" }
proc-macro2 = "1.0.106"
once_cell = "1.21.4"
parking_lot = "0.12.5"
proptest = "1.11.0"
quote = "1.0.46"
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }
rand = "0.10.2"
# Dev-only comparison baseline for `docs/benchmark_results.md`. Its default features
# are SIMD (avx/sse/neon) with no rayon edge, so it does not reintroduce the
# transitive parallelism ADR 0011 removed with Criterion.
rustfft = "6.4.1"
# Dev-only power-of-two transform reference (external comparison). Default
# features are `parallel`, which pulls rayon; they are off so this baseline does
# not reintroduce the transitive parallelism ADR 0011 removed with Criterion.
# The split real/imaginary entry points used here need no optional feature.
phastft = { version = "0.4.1", default-features = false }
# Dev-only real-to-complex reference. realfft is the standard Rust wrapper that
# exploits real-input symmetry over rustfft: a size-N real transform costs about
# half a size-N complex one and yields N/2+1 bins instead of N.
realfft = "3.5.0"
# Temporary co-evolution pin for the worker-idle reclamation seam; remove
# `rev` after Moirai's hook lands on main and regenerate Cargo.lock.
moirai = { package = "moirai-runtime", version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git", rev = "83aa411", features = ["melinoe"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.118", features = ["full"] }
# themis owns CPU topology across the stack: NUMA nodes, cache levels, and the
# per-processor efficiency class the pinned measurement instruments select on
# (ADR 0043). `std` supplies the platform detection backends.
themis = { package = "themis-topology", version = "0.10.1", git = "https://github.com/ryancinsight/themis", default-features = false, features = ["std"] }
thiserror = "2.0.18"
# Hephaestus 0.15 owns Apollo's WGPU 30 device contract.

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
default_constructed_unit_structs = "allow"
doc_lazy_continuation = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
manual_div_ceil = "allow"
manual_slice_size_calculation = "allow"
len_zero = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
range_minus_one = "allow"
default_trait_access = "allow"
useless_conversion = "allow"
from_over_into = "allow"
cast_lossless = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_fields_in_debug = "allow"
needless_pass_by_value = "allow"
needless_for_each = "allow"
redundant_closure_for_method_calls = "allow"
format_in_format_args = "allow"
match_like_matches_macro = "allow"
float_cmp = "allow"
unreadable_literal = "allow"
explicit_iter_loop = "allow"
unused_unit = "allow"
semicolon_if_nothing_returned = "allow"
pub_underscore_fields = "allow"
doc_markdown = "allow"
manual_is_power_of_two = "allow"
trivially_copy_pass_by_ref = "allow"
let_and_return = "allow"
match_same_arms = "allow"
single_match = "allow"
single_match_else = "allow"
redundant_field_names = "allow"
needless_return = "allow"
unneeded_field_pattern = "allow"
explicit_write = "allow"
manual_range_contains = "allow"
uninlined_format_args = "allow"

