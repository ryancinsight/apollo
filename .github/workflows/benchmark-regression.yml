name: benchmark regression

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .cargo/**
      - crates/apollo-bench/**
      - crates/apollo-fft/**
      - crates/apollo-fft-macros/**
      - crates/apollo-leto-interop/**
      - .github/workflows/benchmark-regression.yml
      - scripts/prepare_benchmark.py
      - scripts/tests/**
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git revision used as the performance baseline
        required: true
        default: main
        type: string
      candidate_ref:
        description: Git revision compared with the baseline
        required: true
        type: string
      force_measurements:
        description: >-
          Run the pair jobs even when the identity gate finds the executables'
          code identical. Diagnostic only: the candidate-role bias under
          investigation shows on identical code, which the gate otherwise skips.
        required: false
        default: false
        type: boolean
      swap_roles:
        description: >-
          Exchange the baseline and candidate executables after extraction so
          the "candidate" reports run the baseline binary. Diagnostic only: a
          slowdown that persists attaches to the role or invocation; one that
          flips attaches to the artifact.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: benchmark-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-artifact:
    name: benchmark artifact (${{ matrix.revision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        revision:
          - baseline
          - candidate
    env:
      BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_ref }}
      # Immutable head/base SHAs survive deletion of a pull request's merge
      # ref. They compare those exact revisions; when the head does not contain
      # the selected base, their delta also includes the branches' divergence.
      CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_ref }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      REVISION: ${{ matrix.revision }}
    steps:
      - name: Checkout baseline at canonical path
        if: matrix.revision == 'baseline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_REF }}
          path: apollo-measurement
          persist-credentials: false

      - name: Checkout candidate instrument
        if: matrix.revision == 'baseline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: apollo-candidate-source
          persist-credentials: false

      - name: Checkout candidate at canonical path
        if: matrix.revision == 'candidate'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: apollo-measurement
          persist-credentials: false

      - name: Checkout the atlas comparer
        if: matrix.revision == 'candidate'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryancinsight/atlas
          ref: 12a92b53f87e37ef936d12007a172ada25305d6c
          path: atlas-tool
          sparse-checkout: scripts/bench_executable_identity.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Test benchmark preparation
        if: matrix.revision == 'candidate'
        shell: bash
        run: python3 -m unittest discover -s apollo-measurement/scripts/tests -v

      # Share only instrument sources; each production revision owns its graph.
      - name: Prepare baseline benchmark sources
        if: matrix.revision == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-build-evidence/baseline
          python3 apollo-candidate-source/scripts/prepare_benchmark.py \
            apollo-candidate-source apollo-measurement \
            > benchmark-build-evidence/baseline/preparation.json

      - name: Install the benchmark toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0

      # Restore compiler artifacts as well as registry sources. Pull requests
      # restore the shared default-branch cache but cannot replace it.
      - name: Restore the benchmark build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: apollo-benchmark
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile measured benchmark executables
        shell: bash
        run: |
          set -euo pipefail
          evidence="benchmark-build-evidence/$REVISION"
          mkdir -p "$evidence"
          messages="$evidence/artifacts.json"
          git -C apollo-measurement rev-parse HEAD > "$evidence/revision.txt"
          snapshot_manifests() {
            (
              cd apollo-measurement || exit
              find . -name Cargo.toml -type f -not -path './.git/*' \
                -not -path './target/*' -print0 | sort -z | xargs -0 sha256sum || exit
              sha256sum Cargo.lock
            ) > "$1"
          }
          snapshot_manifests "$evidence/manifests-before.sha256"
          finish() {
            result=$?
            trap - EXIT
            if ! snapshot_manifests "$evidence/manifests-after.sha256"; then
              if [[ "$result" == 0 ]]; then result=1; fi
            fi
            if ! cmp -s "$evidence/manifests-before.sha256" "$evidence/manifests-after.sha256"; then
              echo "::error::build changed a revision manifest or lockfile" >&2
              if [[ "$result" == 0 ]]; then result=1; fi
            fi
            printf '{"exit_code": %d}\n' "$result" > "$evidence/result.json"
            if [[ "$result" != 0 ]]; then
              for diagnostic in "$messages" "$evidence/comparator.json"; do
                if [[ -f "$diagnostic" ]]; then
                  if ! jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' "$diagnostic" >&2; then
                    echo "::error::cannot render $diagnostic; raw diagnostics retained" >&2
                  fi
                fi
              done
            fi
            exit "$result"
          }
          trap finish EXIT
          target_args=(
            --bench kernel_strategy
            --bench prime_compose
            --bench half_cyclic_rader
          )
          cargo bench --profile release \
            --manifest-path apollo-measurement/Cargo.toml \
            --locked \
            -p apollo-fft \
            --features kernel-strategy-bench \
            "${target_args[@]}" \
            --no-run \
            --message-format=json \
            > "$messages"

          destination="benchmark-executables/$REVISION"
          mkdir -p "$destination"
          for benchmark in kernel_strategy prime_compose half_cyclic_rader; do
            executable="$(
              jq -r \
                --arg benchmark "$benchmark" \
                'select(.reason == "compiler-artifact" and .target.name == $benchmark) | .executable // empty' \
                "$messages" \
                | tail -n 1
            )"
            test -n "$executable"
            install -m 755 "$executable" "$destination/$benchmark"
          done

          if [[ "$REVISION" == candidate ]]; then
            cargo build --profile release \
              --manifest-path apollo-measurement/Cargo.toml \
              --locked \
              -p apollo-bench \
              --bin apollo-bench-compare \
              --message-format=json > "$evidence/comparator.json"
            install -m 755 \
              "$CARGO_TARGET_DIR/release/apollo-bench-compare" \
              benchmark-executables/apollo-bench-compare
            # The identity job has no source checkout; atlas's code-section
            # comparer rides in this archive like the compare tool does.
            install -m 755 \
              atlas-tool/scripts/bench_executable_identity.py \
              benchmark-executables/bench_executable_identity.py
          fi

          for benchmark in kernel_strategy prime_compose half_cyclic_rader; do
            sha256sum "benchmark-executables/$REVISION/$benchmark"
          done > "benchmark-executables/$REVISION.sha256"
          tar --create --gzip \
            --file "benchmark-executables-$REVISION.tar.gz" \
            benchmark-executables

      - name: Upload benchmark build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-build-evidence-${{ matrix.revision }}
          path: benchmark-build-evidence/${{ matrix.revision }}
          if-no-files-found: warn
          retention-days: 1

      - name: Upload benchmark executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-executables-${{ matrix.revision }}
          path: benchmark-executables-${{ matrix.revision }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  benchmark-identity:
    name: benchmark executable identity
    needs: benchmark-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      measurements_required: ${{ steps.identity.outputs.measurements_required }}
    steps:
      - name: Download benchmark executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-executables-*
          path: executable-artifacts
          merge-multiple: true

      - name: Restore benchmark executables
        shell: bash
        run: |
          set -euo pipefail
          for archive in executable-artifacts/*.tar.gz; do
            tar --extract --gzip --file "$archive"
          done

      - name: Smoke candidate benchmark executables
        shell: bash
        env:
          APOLLO_BENCH_MODE: smoke
        run: |
          set -euo pipefail
          for benchmark in kernel_strategy prime_compose half_cyclic_rader; do
            timeout 60s "benchmark-executables/candidate/$benchmark" > /dev/null
          done

      - name: Compare benchmark executables
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          measurements_required=false
          for benchmark in kernel_strategy prime_compose half_cyclic_rader; do
            sha256sum \
              "benchmark-executables/baseline/$benchmark" \
              "benchmark-executables/candidate/$benchmark"
            # Whole-file identity never holds across the two build directories
            # (symbol hashes, build id, .strtab follow the path), so compare the
            # code sections. 0 = identical code, 1 = differs, else malformed.
            rc=0
            python3 benchmark-executables/bench_executable_identity.py \
              "benchmark-executables/baseline/$benchmark" \
              "benchmark-executables/candidate/$benchmark" || rc=$?
            case "$rc" in
              0) ;;
              1) measurements_required=true ;;
              *) echo "::error::bench_executable_identity failed on $benchmark (exit $rc)"; exit "$rc" ;;
            esac
          done
          if [[ "${{ inputs.force_measurements }}" == "true" ]]; then
            echo "::notice::measurements forced by dispatch input despite identical code"
            measurements_required=true
          fi
          echo "measurements_required=$measurements_required" >> "$GITHUB_OUTPUT"

  benchmark-pair:
    name: benchmark pair (${{ matrix.pair_id }})
    needs: benchmark-identity
    if: needs.benchmark-identity.outputs.measurements_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair_id: first-baseline-first
            report_root: reports/first/baseline-first
            first_revision: baseline
            second_revision: candidate
          - pair_id: first-candidate-first
            report_root: reports/first/candidate-first
            first_revision: candidate
            second_revision: baseline
          - pair_id: second-candidate-first
            report_root: reports/second/candidate-first
            first_revision: candidate
            second_revision: baseline
          - pair_id: second-baseline-first
            report_root: reports/second/baseline-first
            first_revision: baseline
            second_revision: candidate
    env:
      FIRST_REVISION: ${{ matrix.first_revision }}
      PAIR_ID: ${{ matrix.pair_id }}
      REPORT_ROOT: ${{ matrix.report_root }}
      SECOND_REVISION: ${{ matrix.second_revision }}
    steps:
      - name: Download benchmark executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-executables-*
          path: executable-artifacts
          merge-multiple: true

      - name: Restore benchmark executables
        shell: bash
        run: |
          set -euo pipefail
          for archive in executable-artifacts/*.tar.gz; do
            tar --extract --gzip --file "$archive"
          done
          if [[ "${{ inputs.swap_roles }}" == "true" ]]; then
            # Diagnostic: the reports keep their role names, the binaries trade
            # places, so a role-attached bias survives and a file-attached one
            # flips sign.
            mv benchmark-executables/baseline benchmark-executables/.swap
            mv benchmark-executables/candidate benchmark-executables/baseline
            mv benchmark-executables/.swap benchmark-executables/candidate
            echo "::warning::roles swapped: 'baseline' reports run the candidate executable and vice versa"
          fi

      - name: Measure counterbalanced pair
        shell: bash
        run: |
          set -euo pipefail
          measure() {
            local revision="$1"
            local report_directory="$REPORT_ROOT/$revision"
            mkdir -p "$report_directory"
            for benchmark in kernel_strategy prime_compose half_cyclic_rader; do
              timeout 300s "benchmark-executables/$revision/$benchmark" \
                > "$report_directory/$benchmark.csv"
            done
          }

          measure "$FIRST_REVISION"
          measure "$SECOND_REVISION"
          tar --create --gzip --file "$PAIR_ID.tar.gz" reports

      - name: Upload counterbalanced pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-pair-${{ matrix.pair_id }}
          path: ${{ matrix.pair_id }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  benchmark-regression:
    name: benchmark regression check
    if: always()
    needs:
      - benchmark-identity
      - benchmark-pair
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MEASUREMENTS_REQUIRED: ${{ needs.benchmark-identity.outputs.measurements_required }}
    steps:
      - name: Validate benchmark prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.benchmark-identity.result }}" != success ]]; then
            echo "::error::benchmark executable identity did not pass"
            exit 1
          fi
          if [[ "$MEASUREMENTS_REQUIRED" == true \
            && "${{ needs.benchmark-pair.result }}" != success ]]; then
            echo "::error::one or more benchmark pairs did not pass"
            exit 1
          fi

      - name: Accept executable identity proof
        if: env.MEASUREMENTS_REQUIRED == 'false'
        run: >-
          echo "baseline and candidate benchmark executables are byte-identical;
          no candidate-caused performance regression exists"

      - name: Download candidate comparator
        if: env.MEASUREMENTS_REQUIRED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-executables-candidate
          path: executable-artifacts

      - name: Download counterbalanced pairs
        if: env.MEASUREMENTS_REQUIRED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-pair-*
          path: pair-artifacts
          merge-multiple: true

      - name: Restore comparison inputs
        if: env.MEASUREMENTS_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --gzip \
            --file executable-artifacts/benchmark-executables-candidate.tar.gz
          for archive in pair-artifacts/*.tar.gz; do
            tar --extract --gzip --file "$archive"
          done

      - name: Compare reports
        if: env.MEASUREMENTS_REQUIRED == 'true'
        run: >-
          benchmark-executables/apollo-bench-compare
          compare-replicated-counterbalanced
          --first-baseline-first-baseline-directory reports/first/baseline-first/baseline
          --first-baseline-first-candidate-directory reports/first/baseline-first/candidate
          --first-candidate-first-baseline-directory reports/first/candidate-first/baseline
          --first-candidate-first-candidate-directory reports/first/candidate-first/candidate
          --second-baseline-first-baseline-directory reports/second/baseline-first/baseline
          --second-baseline-first-candidate-directory reports/second/baseline-first/candidate
          --second-candidate-first-baseline-directory reports/second/candidate-first/baseline
          --second-candidate-first-candidate-directory reports/second/candidate-first/candidate
