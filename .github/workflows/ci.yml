name: ci

on:
  push:
    branches: [main]
    # Board and ADR writes land on main by themselves and change no code; a
    # run for them only costs minutes and, under the concurrency group below,
    # would cancel the merge verification in flight. A merge touching code
    # plus one of these still runs: paths-ignore skips only when every changed
    # file matches. READMEs and CHANGELOG stay in scope because crate docs can
    # include them.
    paths-ignore:
      - backlog.md
      - checklist.md
      - gap_audit.md
      - docs/adr/**
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push to main is the merge gate and must reach a verdict; only a
  # superseded pull-request run is safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr-index:
    name: ADR index is current
    # atlas owns the one generator; this replaces the copy that lived in
    # scripts/adr-index.py and the step that ran it (ATLAS-ADR-INDEX-GUARD-2026-09-01).
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@8585a1ade6045b5851b0cc9dab5b08bb75554519
    permissions:
      contents: read
    with:
      strict: true

  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  # The shared Atlas SemVer gate (ADR 0035 family): informational against the
  # PR base while a change is in review, blocking against the latest
  # published version on release. The published baseline is what makes the
  # gate reachable for this workspace at all — a tag baseline rebuilt from
  # source cannot resolve first-party git dependencies that have since bumped
  # (ATLAS-APOLLO-SEMVER-BASELINE-UNBUILDABLE). The package list is every
  # member published on crates.io; apollo-bench and apollo-python are not.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@9062cfc6d78808cf1b7af60ae97f11825a6c8468
    with:
      package: apollo-czt,apollo-dctdst,apollo-dht,apollo-fft,apollo-fft-macros,apollo-frft,apollo-fwht,apollo-gft,apollo-hilbert,apollo-leto-interop,apollo-mellin,apollo-ntt,apollo-nufft,apollo-qft,apollo-radon,apollo-sdft,apollo-sft,apollo-sht,apollo-stft,apollo-validation,apollo-wavelet
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  rust:
    name: rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apollo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: apollo
      - uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613
        with:
          components: clippy, rustfmt
      # `hephaestus-cuda` uses NVIDIA's generated CUDA bindings, which require
      # the driver, runtime/compiler, and cuRAND headers from CUDA 13.2+ even
      # when no device is present. Install only that header closure: the full
      # toolkit exhausts the hosted runner without adding coverage to this
      # compile and test gate.
      - name: Install CUDA toolkit
        run: |
          wget --no-verbose -O /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            cuda-cudart-dev-13-3 cuda-driver-dev-13-3 cuda-nvcc-13-3 \
            libcurand-dev-13-3
          test -f /usr/local/cuda-13.3/include/cuda.h
          cuda_stub="$(find /usr/local/cuda-13.3 -path '*/stubs/libcuda.so' -print -quit)"
          test -n "$cuda_stub"
          cuda_lib_path="$(dirname "$cuda_stub")"
          cuda_runtime_path="$RUNNER_TEMP/cuda-driver-stubs"
          mkdir -p "$cuda_runtime_path"
          ln -sf "$cuda_stub" "$cuda_runtime_path/libcuda.so.1"
          {
            echo "CUDA_TOOLKIT_PATH=/usr/local/cuda-13.3"
            echo "CUDA_LIB_PATH=$cuda_lib_path"
            echo "LD_LIBRARY_PATH=$cuda_runtime_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-nextest@0.9.140,cargo-audit@0.22.2,cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apollo
          cache-targets: false
      # `cargo fmt --all` treats every path-sourced package reachable in the
      # resolved graph as "local" and formats it — including the fleet
      # siblings pulled in only via the [patch] table above. Scope to
      # apollo's own workspace members (cargo metadata --no-deps correctly
      # excludes patched externals) so CI never lints/formats another repo's
      # source.
      - name: Format
        run: |
          cargo metadata --locked --no-deps --format-version=1 \
            | jq -r '.packages[].name' \
            | while read -r package; do cargo fmt -p "$package" -- --check; done
      - name: SAFETY ratchet
        run: python scripts/safety_ratchet.py check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # apollo-python builds pyo3 with the "extension-module" feature, which
      # deliberately omits linking against libpython (Python dynamically
      # loads the .so and supplies those symbols at runtime). A `cargo test`
      # binary is a normal executable that needs those symbols itself, so it
      # cannot link — apollo-python is exercised by the separate "python
      # bindings" job instead (maturin develop + pytest).
      #
      - name: Tests
        run: cargo nextest run --locked --workspace --all-features --exclude apollo-python --no-fail-fast
      - name: Build benchmark smoke
        run: >-
          cargo test --locked -p apollo-fft --all-features --no-run
          --bench rustfft_comparison
          --bench phastft_comparison
          --bench engine_census
          --bench kernel_strategy
          --bench prime_compose
          --bench half_cyclic_rader
      - name: Build NUFFT benchmark smoke
        run: >-
          cargo test --locked -p apollo-nufft --all-features --no-run
          --bench buffer_reuse
      - name: Benchmark smoke
        env:
          APOLLO_BENCH_MODE: smoke
        run: >-
          timeout 60s cargo test --locked -p apollo-fft --all-features
          --bench rustfft_comparison
          --bench phastft_comparison
          --bench engine_census
          --bench kernel_strategy
          --bench prime_compose
          --bench half_cyclic_rader
      - name: NUFFT benchmark smoke
        env:
          APOLLO_BENCH_MODE: smoke
        run: >-
          timeout 60s cargo test --locked -p apollo-nufft --all-features
          --bench buffer_reuse
      - name: Doctests
        run: cargo test --locked --doc --workspace --exclude apollo-python
      - name: Documentation
        run: cargo doc --locked --workspace --exclude apollo-python --no-deps
      - name: Provider audit
        run: cargo run --locked -p xtask -- provider-audit
      - name: RustSec audit
        run: cargo audit --deny warnings
      - name: Dependency policy
        run: cargo deny check

  python:
    name: python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apollo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: apollo
      - uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apollo
          cache-targets: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      # maturin develop requires an active virtualenv (or conda env) to
      # install into — there is none by default on the hosted runner.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python test tools
        run: >-
          python -m pip install --upgrade
          pip==26.1.2 maturin==1.14.1 pytest==9.1.1 numpy==2.5.1
      - name: Build Python extension
        working-directory: apollo/crates/apollo-python
        run: maturin develop
      - name: Python smoke tests
        run: pytest crates/apollo-python/tests/test_smoke.py -q
